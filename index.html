<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
  <title>E.V.E.N // Signal Found</title>
  <meta name="description" content="Signal found. Transmission begins." />

  <style>
    :root{
      color-scheme: dark;

      /* softened site palette */
      --bg: #07080b;
      --bg2:#06070a;

      --text: rgba(240,240,242,.86);
      --muted: rgba(240,240,242,.58);
      --soft: rgba(240,240,242,.10);

      /* restrained accents (not full neon) */
      --cyan: rgba(120,255,255,.85);
      --cyanSoft: rgba(120,255,255,.18);
      --mag: rgba(255,90,225,.72);
      --magSoft: rgba(255,90,225,.16);

      --radius: 18px;
      --radius2: 26px;

      --shadow: 0 22px 80px rgba(0,0,0,.55);

      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:
        radial-gradient(900px 520px at 20% 8%, var(--cyanSoft), transparent 55%),
        radial-gradient(900px 520px at 80% 10%, var(--magSoft), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
      font-family: var(--sans);
      overflow:hidden;
      position:relative;
      isolation:isolate;
    }

    /* subtle stars (softened) */
    .stars{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      opacity:.55;
      background:
        radial-gradient(1px 1px at 10% 18%, rgba(120,255,255,.55), transparent 60%),
        radial-gradient(1px 1px at 28% 42%, rgba(240,240,242,.35), transparent 60%),
        radial-gradient(1px 1px at 40% 24%, rgba(120,255,255,.35), transparent 60%),
        radial-gradient(1px 1px at 62% 30%, rgba(255,90,225,.30), transparent 60%),
        radial-gradient(1px 1px at 74% 58%, rgba(240,240,242,.30), transparent 60%),
        radial-gradient(1px 1px at 88% 22%, rgba(120,255,255,.28), transparent 60%),
        radial-gradient(1px 1px at 18% 70%, rgba(255,90,225,.20), transparent 60%),
        radial-gradient(1px 1px at 82% 78%, rgba(120,255,255,.22), transparent 60%),
        radial-gradient(1px 1px at 52% 86%, rgba(240,240,242,.22), transparent 60%);
      filter: blur(.2px);
    }

    /* gentle noise/grain */
    .grain{
      position:fixed;
      inset:-20px;
      z-index:1;
      pointer-events:none;
      opacity:.10;
      background:
        radial-gradient(1px 1px at 18% 24%, rgba(255,255,255,.10), transparent 60%),
        radial-gradient(1px 1px at 42% 62%, rgba(255,255,255,.08), transparent 60%),
        radial-gradient(1px 1px at 78% 38%, rgba(255,255,255,.08), transparent 60%),
        radial-gradient(1px 1px at 60% 80%, rgba(255,255,255,.07), transparent 60%);
      filter: blur(.35px);
    }

    /* centre layout */
    .wrap{
      position:relative;
      z-index:2;
      height:100%;
      display:grid;
      place-items:center;
      padding: 28px 18px;
    }

    .card{
      width:min(720px, 100%);
      text-align:center;
      padding: 56px 20px 44px;
      border-radius: var(--radius2);
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(10,11,14,.40);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      position:relative;
      overflow:hidden;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(780px 260px at 30% 0%, rgba(120,255,255,.16), transparent 60%),
        radial-gradient(780px 260px at 70% 0%, rgba(255,90,225,.12), transparent 60%);
      opacity:.65;
      pointer-events:none;
    }

    .brand{
      position:relative;
      display:inline-block;
      font-family: var(--mono);
      font-size: clamp(46px, 7vw, 84px);
      letter-spacing: .12em;
      text-transform: uppercase;
      line-height: 1.02;
      margin: 0;
      color: rgba(240,240,242,.92);
      text-shadow:
        0 0 0 rgba(0,0,0,0),
        0 14px 60px rgba(0,0,0,.55);
    }

    /* softened glitch: subtle colour separation only */
    .brand::before,
    .brand::after{
      content: attr(data-text);
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:.16;
      clip-path: inset(0 0 0 0);
      letter-spacing: inherit;
      text-transform: inherit;
      font-family: inherit;
    }

    .brand::before{
      transform: translate(1px,0);
      color: rgba(120,255,255,.55);
      animation: glitchTop 5.3s infinite;
    }

    .brand::after{
      transform: translate(-1px,0);
      color: rgba(255,90,225,.42);
      animation: glitchBot 4.9s infinite;
    }

    @keyframes glitchTop{
      0%,100%{ clip-path: inset(0 0 92% 0); }
      22%{ clip-path: inset(0 0 72% 0); }
      44%{ clip-path: inset(0 0 88% 0); }
      66%{ clip-path: inset(0 0 78% 0); }
      88%{ clip-path: inset(0 0 90% 0); }
    }

    @keyframes glitchBot{
      0%,100%{ clip-path: inset(88% 0 0 0); }
      26%{ clip-path: inset(76% 0 0 0); }
      52%{ clip-path: inset(92% 0 0 0); }
      78%{ clip-path: inset(80% 0 0 0); }
      90%{ clip-path: inset(94% 0 0 0); }
    }

    .tagline{
      margin: 18px auto 0;
      font-family: var(--mono);
      font-size: 16px;
      letter-spacing: .06em;
      color: rgba(255,90,225,.72); /* softened magenta */
      text-shadow: 0 0 18px rgba(255,90,225,.12);
      max-width: 52ch;
      position:relative;
      z-index:1;
    }

    .cta{
  margin-top: 26px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding: 14px 22px;
  border-radius: 14px;
  border: 1px solid rgba(120,255,255,.45);
  background: linear-gradient(
    180deg,
    rgba(120,255,255,.75),
    rgba(120,255,255,.60)
  );
  color: rgba(8,12,16,.95); /* darker text = higher contrast */
  font-family: var(--mono);
  font-size: 14px;
  letter-spacing: .14em;
  text-transform: uppercase;
  text-decoration:none;
  box-shadow:
    0 14px 40px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.35);
  transition:
    transform .16s ease,
    box-shadow .16s ease,
    background .16s ease;
}

.cta:hover{
  transform: translateY(-1px);
  background: linear-gradient(
    180deg,
    rgba(140,255,255,.85),
    rgba(120,255,255,.70)
  );
  box-shadow:
    0 18px 55px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.45);
}

    .cta:focus-visible{
      outline: 2px solid rgba(120,255,255,.45);
      outline-offset: 3px;
    }

    .meta{
      margin: 18px auto 0;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: .08em;
      color: var(--muted);
      text-transform: uppercase;
      position:relative;
      z-index:1;
    }

    .meta .dot{
      display:inline-block;
      width:6px;
      height:6px;
      border-radius:50%;
      background: rgba(120,255,255,.75);
      box-shadow: 0 0 12px rgba(120,255,255,.25);
      margin: 0 8px;
      vertical-align: middle;
      opacity:.9;
    }

    /* small footer hint (optional, but nice for first-timers) */
    .hint{
      margin-top: 10px;
      font-size: 12px;
      color: rgba(240,240,242,.46);
      font-family: var(--mono);
      letter-spacing: .06em;
    }

    @media (prefers-reduced-motion: reduce){
      .brand::before,.brand::after{ animation:none !important; }
    }
  </style>
</head>

<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="wrap" aria-label="E.V.E.N landing">
    <section class="card" aria-label="Signal found intro">
      <h1 class="brand" data-text="E.V.E.N">E.V.E.N</h1>

      <p class="tagline">Signal found. Transmission begins.</p>

      <a class="cta" href="/home.html" aria-label="Enter the Network">
        Enter the Network
      </a>

      <div class="meta" aria-hidden="true">
        <span>index</span><span class="dot"></span><span>handoff: /home.html</span>
      </div>
    </section>
  </main>
</body>
</html>
