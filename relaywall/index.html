<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<title>Relay Wall</title>

<style>

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #0b0b0d;
}

body {
  overflow-x: hidden;
  background-image: url("/relaywall/ghost-lines-wall-tile.png");
  background-repeat: repeat;
  background-size: 700px 700px;
  background-position: top center;
}

.graffiti-wall {
  position: relative;
  width: 100%;
  min-height: 4000px;
  overflow: hidden;
}

/* Atmospheric overlay */

.graffiti-wall::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background:
    radial-gradient(circle at 50% 20%, rgba(255,255,255,0.06), transparent 28%),
    radial-gradient(circle at 10% 40%, rgba(0,0,0,0.35), transparent 35%),
    radial-gradient(circle at 90% 75%, rgba(0,0,0,0.45), transparent 38%),
    linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(0,0,0,0.45));
  mix-blend-mode: multiply;
}

/* FOUNDATIONS POSTER */

.foundations-poster {
  position: absolute;
  top: 40px;
  left: 50%;
  transform: translateX(-50%) rotate(-1.5deg);
  z-index: 10;
}

.foundations-poster img {
  display: block;
  width: 420px;
  height: auto;
  filter: drop-shadow(0 12px 24px rgba(0,0,0,0.55));
}

/* SUBMISSIONS STICKER */

.submit-sticker {
  position: absolute;
  top: 70px;
  left: calc(50% - 280px);
  transform: rotate(4deg);
  z-index: 20;
  transition: transform 0.2s ease;
}

.submit-sticker:hover {
  transform: rotate(4deg) scale(1.03);
}

.submit-sticker img {
  display: block;
  width: 180px;
  height: auto;
  filter: drop-shadow(0 8px 18px rgba(0,0,0,0.45));
}

  /* NUYU POSTER */

  .nuyu-poster {
  position: absolute;
  top: 900px;
  left: 68%;
  transform: rotate(1.8deg);
  z-index: 8;
}

.nuyu-poster img {
  display: block;
  width: 440px;
  height: auto;
  filter: drop-shadow(0 10px 20px rgba(0,0,0,0.45));
}

/* WHERE'S RAYNE? */

  .rayne-tag {
  position: absolute;
  top: 650px;
  left: 8%;
  transform: rotate(-6deg);
  z-index: 15;
}

.rayne-tag img {
  display: block;
  width: 420px;
  height: auto;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,0.35));
}

/* RAYNE REPLY */

  .rayne-reply {
  position: absolute;
  top: 880px;
  left: 14%;
  transform: rotate(3deg);
  z-index: 16;
}

.rayne-reply img {
  display: block;
  width: 280px;
  height: auto;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));
}

 /* EXIT TUNNEL BACK BUTTON */
  
  .exit-tunnel {
  position: absolute;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) rotate(-3deg);
  z-index: 20;
  transition: transform 0.2s ease;
}

.exit-tunnel:hover {
  transform: translateX(-50%) rotate(-3deg) scale(1.03);
}

.exit-tunnel img {
  display: block;
  width: 240px;
  height: auto;
  filter: drop-shadow(0 8px 18px rgba(0,0,0,0.45));
}

   /* PATCH CLINIC 01 */
  
  .patch-clinic1 {
  position: absolute;
  bottom: 300px;
  left: 25%;
  transform: translateX(-50%) rotate(-2deg);
  z-index: 20;
}

.patch-clinic1 img {
  display: block;
  width: 440px;
  height: auto;
  filter: drop-shadow(0 8px 18px rgba(0,0,0,0.45));
}

/* MOBILE */

@media (max-width: 768px) {

  body {
    background-size: 520px 520px;
  }

  .graffiti-wall {
    min-height: 3000px;
  }

  .foundations-poster {
    top: 45px;
    left: 50%;
    transform: translateX(-50%) rotate(-1.5deg);
  }

  .foundations-poster img {
    width: min(78vw, 420px);
  }

  .submit-sticker {
    top: 72px;
    left: 8vw;
    transform: rotate(4deg);
  }

  .submit-sticker:hover {
    transform: rotate(4deg) scale(1.02);
  }

  .submit-sticker img {
    width: min(34vw, 145px);
  }

  .exit-tunnel img {
  width: 180px;
}
}

  @media (max-width: 420px) {

  .foundations-poster img {
    width: 82vw;
  }

  .submit-sticker {
    top: 65px;
    left: 5vw;
  }

  .submit-sticker img {
    width: 125px;
  }
}
  

</style>
</head>

<body>

<main class="graffiti-wall">

  <a href="#"
     class="submit-sticker">
    <img src="/relaywall/images/submissions-open.png"
         alt="Submissions Open">
  </a>

  <div class="foundations-poster">
    <img src="/relaywall/images/evenfoundationsposter.png"
         alt="E.V.E.N Foundations Poster">
  </div>

  <div class="nuyu-poster">
    <img src="/relaywall/images/NuYuPoster.png"
         alt="NuYu Security Notice">
</div>

    <div class="rayne-tag">
  <img src="/relaywall/images/wheresrayne.png"
       alt="Where's Rayne">
</div>

  <div class="rayne-reply">
  <img src="/relaywall/images/doesanyoneknow.png"
       alt="Does anyone really know?">
</div>

      <div class="patch-clinic1">
  <img src="/relaywall/images/patchclinicnote01.png"
       alt="Patch Clinic Poster 1">
</div>

  <a href="/home.html" class="exit-tunnel">
    <img src="/relaywall/images/exittunnel.png"
         alt="Exit Tunnel">
</a>

</main>

</body>
</html>
