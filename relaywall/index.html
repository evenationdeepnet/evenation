<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relay Wall</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0b0b0d;
    }

    body {
      overflow-x: hidden;
      background-image: url("ghost-lines-wall-tile.png");
      background-repeat: repeat;
      background-size: 700px 700px;
      background-position: top center;
    }

    .graffiti-wall {
      position: relative;
      width: 100%;
      min-height: 4000px;
      overflow: hidden;
    }

    .graffiti-wall::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,0.06), transparent 28%),
        radial-gradient(circle at 10% 40%, rgba(0,0,0,0.35), transparent 35%),
        radial-gradient(circle at 90% 75%, rgba(0,0,0,0.45), transparent 38%),
        linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(0,0,0,0.45));
      mix-blend-mode: multiply;
    }
  </style>
</head>

<body>
  <main class="graffiti-wall"></main>
</body>
</html>
