<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Relay Wall</title>

<style>

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #0b0b0d;
}

body {
  overflow-x: hidden;
  background-image: url("/relaywall/ghost-lines-wall-tile.png");
  background-repeat: repeat;
  background-size: 700px 700px;
  background-position: top center;
}

.graffiti-wall {
  position: relative;
  width: 100%;
  min-height: 4000px;
  overflow: hidden;
}

/* Atmospheric overlay */

.graffiti-wall::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background:
    radial-gradient(circle at 50% 20%, rgba(255,255,255,0.06), transparent 28%),
    radial-gradient(circle at 10% 40%, rgba(0,0,0,0.35), transparent 35%),
    radial-gradient(circle at 90% 75%, rgba(0,0,0,0.45), transparent 38%),
    linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(0,0,0,0.45));
  mix-blend-mode: multiply;
}

/* FOUNDATIONS POSTER */

.foundations-poster {
  position: absolute;
  top: 40px;
  left: 50%;
  transform: translateX(-50%) rotate(-1.5deg);
  z-index: 10;
}

.foundations-poster img {
  display: block;
  width: 420px;
  height: auto;
  filter: drop-shadow(0 12px 24px rgba(0,0,0,0.55));
}

/* SUBMISSIONS STICKER */

.submit-sticker {
  position: absolute;
  top: 70px;
  left: calc(50% - 280px);
  transform: rotate(4deg);
  z-index: 20;
  transition: transform 0.2s ease;
}

.submit-sticker:hover {
  transform: rotate(4deg) scale(1.03);
}

.submit-sticker img {
  display: block;
  width: 180px;
  height: auto;
  filter: drop-shadow(0 8px 18px rgba(0,0,0,0.45));
}

/* MOBILE */

@media (max-width: 768px) {

  .foundations-poster {
    top: 30px;
  }

  .foundations-poster img {
    width: 80vw;
    max-width: 420px;
  }

  .submit-sticker {
    left: 20px;
    top: 50px;
  }

  .submit-sticker img {
    width: 140px;
  }

}

</style>
</head>

<body>

<main class="graffiti-wall">

  <a href="#"
     class="submit-sticker">
    <img src="/relaywall/submissions-open.png"
         alt="Submissions Open">
  </a>

  <div class="foundations-poster">
    <img src="/relaywall/evenfoundationsposter.png"
         alt="E.V.E.N Foundations Poster">
  </div>

</main>

</body>
</html>
